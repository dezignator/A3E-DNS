-- Encrypted-DNS front end for the v2 stack (DoT, DoH, DoQ). Certificates are lab certificates.
newServer({address="10.0.2.53:53", name="backend"})
addTLSLocal("0.0.0.0:853", "/certs/lab.pem", "/certs/lab.key")
addDOHLocal("0.0.0.0:443", "/certs/lab.pem", "/certs/lab.key", "/dns-query")
addDOQLocal("0.0.0.0:853", "/certs/lab.pem", "/certs/lab.key")
setACL({"10.0.0.0/8"})
